<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LanceSoft Cabs</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <script defer src="https://jsdelivr.net"></script>
    <script defer src="app.js"></script>
    <style>
        body { background-color: #f4f7f6; font-family: sans-serif; }
        .app-header { background-color: #0b2240; color: white; padding: 15px; text-align: center; }
        .card { border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        #webcam { border: 3px solid #0b2240; border-radius: 10px; background-color: #222; transform: scaleX(-1); }
    </style>
</head>
<body>
    <div class="app-header">
        <h2>🚖 LanceSoft Cabs</h2>
        <p class="mb-0">Office Cab Attendance & Duty Management</p>
    </div>

    <div class="container my-4">
        <div class="card p-4 mb-4 text-center">
            <h4 class="card-title text-primary mb-3"> (Face Verification)</h4>
            <div class="position-relative d-inline-block mx-auto">
                <video id="webcam" width="320" height="240" autoplay muted></video>
            </div>
            <div class="mt-3">
                <button id="btn-scan" class="btn btn-success px-4"> 👤</button>
                <p id="camera-status" class="text-muted small mt-2"> ...</p>
            </div>
        </div>

        <div class="card p-4">
            <h4 class="card-title mb-3"> (Sign In)</h4>
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label"> (Email)</label>
                    <input type="email" id="email" class="form-control" placeholder="name@company.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label"> (Password)</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100"> </button>
            </form>
        </div>
    </div>

</body>
</html>
